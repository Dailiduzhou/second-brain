name: Publish site

# 三个 job 串行：先做凭据扫描，扫描通过才构建，构建产物只在 main 上发布。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # 固定 Quartz 版本，避免 upstream 变动直接打断发布。
  QUARTZ_REF: v4.5.2
  GITLEAKS_VERSION: 8.30.1

jobs:
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # 要扫全部历史，默认的浅克隆不够。
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan history and working tree (redacted)
        # --redact 把命中值替换成 REDACTED，公开仓库的 CI 日志不会再泄漏一次。
        # 发现泄漏时退出码为 1，直接拦住后续的 build / deploy。
        run: |
          gitleaks git --config .gitleaks.toml --redact --verbose --log-opts=--all --no-banner
          gitleaks dir . --config .gitleaks.toml --redact --verbose --no-banner

  build:
    name: build (bun)
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # fetch-depth: 0 让 Quartz 用 git 历史推算每篇笔记的创建/修改时间。
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Cache Quartz dependencies
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/quartz/node_modules
          key: quartz-${{ env.QUARTZ_REF }}-${{ runner.os }}-${{ hashFiles('scripts/quartz.sh') }}

      - name: Build static site
        # scripts/quartz.sh 会在 $QUARTZ_FRAMEWORK_DIR 克隆固定版本 Quartz、
        # 覆盖 .quartz/ 下的配置，然后以本仓库为内容目录构建。
        run: ./scripts/quartz.sh build
        env:
          QUARTZ_FRAMEWORK_DIR: ${{ runner.temp }}/quartz

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/quartz/public

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
